name: Project checks and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Compile source files
        run: python -m compileall -q motiontracker tasktracker scripts examples tests
      - name: Run unit integration migration and process tests
        run: python -m unittest discover -s tests -v
      - name: Rehearse the schema upgrade with synthetic project data
        run: |
          python -m examples.create_v1_database --db data/ci-upgrade.sqlite3
          python -m motiontracker --db data/ci-upgrade.sqlite3 migrate --dry-run
          python -m motiontracker --db data/ci-upgrade.sqlite3 migrate
          python -m motiontracker --db data/ci-upgrade.sqlite3 show 12345678-1234-4234-8234-123456789abc
      - name: Build the versioned application artifact
        run: python -m scripts.build --revision "${{ github.sha }}"
      - name: Check the packaged application
        run: |
          python dist/motiondesk.pyz --db data/ci-artifact.sqlite3 add "CI smoke project" --client "Demo Studio"
          python dist/motiondesk.pyz --db data/ci-artifact.sqlite3 list --json
      - name: Upload application and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: motiondesk-${{ github.sha }}
          path: |
            dist/motiondesk.pyz
            dist/motiondesk.pyz.sha256
          if-no-files-found: error
